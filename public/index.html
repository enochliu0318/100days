<!-- 信封外轮廓裁剪框:后板(12,80,276x176,r12)再向外扩 0.75(描边半宽),半径同步 +0.75。
     前袋 V 形上缘和顶盖的直角端点都落在 (12,82)/(288,82),会戳到后板圆角之外,
     于是角上出现「圆弧台阶 + 底色缺口」。套上这个裁剪框后三层的上圆角统一成 r≈12.75,
     与下方外圆角(r12)一致;信纸 .esheet 和回折盖 .flapback 不裁剪,拆封时要飞出/翻到信封上方。 -->
<clipPath id="envClip"><rect x="11.25" y="79.25" width="277.5" height="177.5" rx="12.75"/></clipPath>
</defs>
<rect x="12" y="80" width="276" height="176" rx="12" fill="url(#peB)" stroke="#ecabc0" stroke-width="1.5"/>
<!-- 翻开的盖子(背面):两条斜边微微外鼓——纸折过之后不会还是直尺边。
     底边落在信封真正的折线上(后板顶边 y=80),两个底角收进后板圆角的切点(x24 / x276)。
     旧版底边按前袋上缘(y=82)拉满 12..288,尖端会戳出信封的圆肩,翻开后像一块和主体脱节的三角片。 -->
<g class="flapback">

<path d="M24 80 Q81 37 150 6 Q219 37 276 80 Z" fill="url(#peT)"/>

     上缘改由后板顶描边 + 折缝暗部(peU)交代,厚度与三边齐平。 -->
<g class="flap"><path d="M12 82 L288 82 L150 178 Z" fill="url(#peG)"/><path d="M12 82 L150 178 L288 82" fill="none" stroke="#e18fa9" stroke-width="1.5" stroke-linejoin="round"/><path d="M28 92 L150 169 L272 92" fill="none" stroke="#fdeaf1" stroke-opacity=".5" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 8"/><path d="M150 113c-4.2-4.6-9.4-7.8-9.4-12.1 0-3.5 2.9-6 6-6 1.9 0 3.2 1.3 3.6 2.5.4-1.2 1.7-2.5 3.6-2.5 3.1 0 6 2.5 6 6 0 4.3-5.2 7.5-9.4 12.1z" fill="#c28a5b" opacity=".5"/></g>
